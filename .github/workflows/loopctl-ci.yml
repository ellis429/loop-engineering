# The unit-linux required check declared in workflow.yaml (design D12).
name: loopctl-ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  unit-linux:
    name: unit-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify the checked-out commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Record the tested commit
        env:
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          printf '{"run_id": %s, "run_attempt": %s, "job": "%s",
          "check_name": "unit-linux", "tested_sha": "%s"}\n'
          "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "$TESTED_SHA"
          > "$RUNNER_TEMP/tested-sha.json"

      - name: Upload the tested commit before testing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-sha-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-sha.json
          if-no-files-found: error

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.24"
          python-version: "3.12"

      - name: Install the locked dependencies
        run: uv sync --frozen

      - name: Run the tests
        env:
          LOOPCTL_EXPECT_PLATFORM: linux
        run: uv run pytest

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src

      - name: Check the built distribution
        run: scripts/dist-smoke.sh
