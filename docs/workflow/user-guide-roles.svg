<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 976" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="le-roles-title le-roles-desc">
      <title id="le-roles-title">從目標到人工驗收：誰決定、誰執行</title>
      <desc id="le-roles-desc">泳道圖：Lead 與 Project Lead Agent 在 Project level 完成分析、基準與 feature 交接；Feature Builder 確認開工後，Implementer 以 TDD 建立 PR，Reviewer 與 CI 並行審查、退回修正，通過後交 Lead 或指定驗收人接受或退回。</desc>
      <defs>
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');

          .nm { font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
          .sb { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; }
          .lb { font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
          .ey { font-family: 'Geist Mono', monospace; font-size: 8px; font-weight: 500; letter-spacing: 0.18em; fill: #4f5d75; }
          .co { font-family: 'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif; font-size: 14px; font-style: italic; fill: #2d3142; }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Human lanes: subtle band -->
      <rect x="120" y="64" width="160" height="832" fill="#4f5d75" fill-opacity="0.06"/>
      <rect x="440" y="64" width="160" height="832" fill="#4f5d75" fill-opacity="0.06"/>

      <!-- Feature coordination zone (Orchestrate + controller) -->
      <rect x="440" y="448" width="480" height="364" rx="8" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="748" y="456" width="164" height="12" rx="2" fill="#f5f5f5"/>
      <text x="908" y="465" class="ey" text-anchor="end">ORCHESTRATE · 1 LOOP</text>

      <!-- Lane dividers -->
      <line x1="120" y1="64" x2="120" y2="896" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
      <line x1="280" y1="64" x2="280" y2="896" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
      <line x1="440" y1="64" x2="440" y2="896" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
      <line x1="600" y1="64" x2="600" y2="896" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
      <line x1="760" y1="64" x2="760" y2="896" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
      <line x1="920" y1="64" x2="920" y2="896" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
      <line x1="24" y1="100" x2="920" y2="100" stroke="#bfc0c0" stroke-width="1"/>

      <!-- Lane headers -->
      <text x="200" y="88" class="lb" text-anchor="middle">Lead（人）</text>
      <text x="360" y="88" class="lb" text-anchor="middle">Project Lead Agent</text>
      <text x="520" y="88" class="lb" text-anchor="middle">Feature Builder（人）</text>
      <text x="680" y="88" class="lb" text-anchor="middle">Implementer Agent</text>
      <text x="840" y="88" class="lb" text-anchor="middle">Reviewer Agent＋CI</text>

      <!-- Level labels and divider -->
      <text x="24" y="124" class="ey">PROJECT</text>
      <text x="24" y="136" class="ey">LEVEL</text>
      <line x1="24" y1="440" x2="920" y2="440" stroke="#bfc0c0" stroke-width="1"/>
      <text x="24" y="500" class="ey">FEATURE</text>
      <text x="24" y="512" class="ey">LEVEL</text>

      <!-- Arrows (drawn before nodes) -->
      <path d="M200 160 V180 Q200 188 208 188 H352 Q360 188 360 196 V200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M360 248 V268 Q360 276 352 276 H208 Q200 276 200 284 V288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M200 336 V356 Q200 364 208 364 H352 Q360 364 360 372 V376" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M360 424 V468 Q360 476 368 476 H672 Q680 476 680 484 V488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M680 536 V556 Q680 564 672 564 H528 Q520 564 520 572 V576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M520 624 V644 Q520 652 528 652 H672 Q680 652 680 660 V664" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M752 688 H832 Q840 688 840 696 V752" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M768 776 H688 Q680 776 680 768 V712" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M840 800 V820 Q840 828 832 828 H208 Q200 828 200 836 V840" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Arrow labels (mask sits 6px above its segment) -->
      <rect x="264" y="166" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="280" y="178" class="lb" text-anchor="middle">目標</text>
      <rect x="252" y="254" width="56" height="16" rx="2" fill="#f5f5f5"/>
      <text x="280" y="266" class="lb" text-anchor="middle">基準草案</text>
      <rect x="236" y="342" width="88" height="16" rx="2" fill="#f5f5f5"/>
      <text x="280" y="354" class="lb" text-anchor="middle">選定 feature</text>
      <rect x="496" y="454" width="48" height="16" rx="2" fill="#f5f5f5"/>
      <text x="520" y="466" class="lb" text-anchor="middle">交接包</text>
      <rect x="556" y="542" width="88" height="16" rx="2" fill="#f5f5f5"/>
      <text x="600" y="554" class="lb" text-anchor="middle">design＋plan</text>
      <rect x="572" y="630" width="56" height="16" rx="2" fill="#f5f5f5"/>
      <text x="600" y="642" class="lb" text-anchor="middle">批准開工</text>
      <rect x="776" y="666" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="792" y="678" class="lb" text-anchor="middle">送審</text>
      <rect x="708" y="754" width="32" height="16" rx="2" fill="#f5f5f5"/>
      <text x="724" y="766" class="lb" text-anchor="middle">修正</text>
      <rect x="468" y="806" width="104" height="16" rx="2" fill="#f5f5f5"/>
      <text x="520" y="818" class="lb" text-anchor="middle">PR Pass 驗收包</text>

      <!-- Nodes -->
      <!-- A: Lead gives goal (human) -->
      <rect x="128" y="112" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="128" y="112" width="144" height="48" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="200" y="132" class="nm" text-anchor="middle">給目標與限制</text>
      <text x="200" y="148" class="sb" text-anchor="middle">goal · constraints</text>

      <!-- B: Project Lead Agent analysis -->
      <rect x="288" y="200" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="200" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="220" class="nm" text-anchor="middle">分析與規劃</text>
      <text x="360" y="236" class="sb" text-anchor="middle">research · SA · roadmap</text>

      <!-- D: Lead confirms baseline (human) -->
      <rect x="128" y="288" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="128" y="288" width="144" height="48" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="200" y="308" class="nm" text-anchor="middle">確認基準與 feature</text>
      <text x="200" y="324" class="sb" text-anchor="middle">baseline · 1st feature</text>

      <!-- E: Project Lead Agent prepares handoff -->
      <rect x="288" y="376" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="288" y="376" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="360" y="396" class="nm" text-anchor="middle">準備 feature 交接</text>
      <text x="360" y="412" class="sb" text-anchor="middle">spec · AC · ticket</text>

      <!-- F: Implementer detailed design -->
      <rect x="608" y="488" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="608" y="488" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="680" y="508" class="nm" text-anchor="middle">詳細設計與 plan</text>
      <text x="680" y="524" class="sb" text-anchor="middle">design · tasks</text>

      <!-- G: engineer confirms start (focal human gate) -->
      <rect x="448" y="576" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="448" y="576" width="144" height="48" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="520" y="596" class="nm" text-anchor="middle">確認開工</text>
      <text x="520" y="612" class="sb" text-anchor="middle">D11 · once per feature</text>

      <!-- H: Implementer TDD and PR -->
      <rect x="608" y="664" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="608" y="664" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="680" y="684" class="nm" text-anchor="middle">TDD 實作與 PR</text>
      <text x="680" y="700" class="sb" text-anchor="middle">G1 before review</text>

      <!-- R: Reviewer + CI -->
      <rect x="768" y="752" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="768" y="752" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="840" y="772" class="nm" text-anchor="middle">獨立審查＋CI</text>
      <text x="840" y="788" class="sb" text-anchor="middle">G2 + G3 · latest head</text>

      <!-- I: human acceptance (focal) -->
      <rect x="128" y="840" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="128" y="840" width="144" height="48" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="200" y="860" class="nm" text-anchor="middle">人工驗收</text>
      <text x="200" y="876" class="sb" text-anchor="middle">accept · return</text>

      <!-- Callout -->
      <path d="M300 858 Q288 862 276 864" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="276" cy="864" r="2" fill="#2d3142"/>
      <text x="304" y="860" class="co">接受不等於 merge，merge 仍由人另行決定。</text>
      <text x="304" y="880" class="co">既有 AC 未滿足→回修正；需求或 AC 改變→回有權裁決的人。</text>

      <!-- Legend -->
      <line x1="24" y1="908" x2="920" y2="908" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="24" y="928" class="ey">LEGEND</text>
      <rect x="24" y="940" width="16" height="12" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <text x="48" y="951" class="lb">人的工作與決策</text>
      <rect x="176" y="940" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="200" y="951" class="lb">Agent 工作</text>
      <rect x="300" y="940" width="16" height="12" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="324" y="951" class="lb">需人批准的關卡</text>
      <line x1="452" y1="946" x2="480" y2="946" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="488" y="951" class="lb">交接物</text>
      <line x1="552" y1="946" x2="580" y2="946" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="588" y="951" class="lb">退回修正</text>
      <rect x="668" y="940" width="16" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="692" y="951" class="lb">每個 feature 一個協調 loop</text>
    </svg>
