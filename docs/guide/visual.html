<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loop Engineering 使用者指南圖解</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; margin: 0 auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 0.75rem;
    }
    h2 {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 400;
      margin: 3rem 0 0.5rem;
    }
    p.lead, p.note { color: var(--color-muted); line-height: 1.6; max-width: 46rem; }
    p.lead { margin-bottom: 1.5rem; }
    p.note { margin-top: 0.75rem; font-size: 0.9rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Loop Engineering</p>
    <h1>圖解</h1>
    <p class="lead">整個流程與人的六個確認點，見使用指南的流程大地圖。這裡放 stacked PR 的現行規則與目標情境。</p>

    <h2>Stacked PR：現行規則與目標情境</h2>
    <p class="lead">左邊是現在的規則。右邊是想展示的目標，它的啟動條件與證據失效規則還沒決定，現在不能這樣執行。</p>

    <div class="scroll">
    <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="le-stack-title le-stack-desc">
      <title id="le-stack-title">Stacked PR：現行規則與目標情境</title>
      <desc id="le-stack-desc">左側為現行規則：下游 PR 等上游人工接受並 merge 進 main 後才開始實作；右側為待決的目標情境：PR C 以 PR B 為 base、PR B 以 PR A 為 base，每個 PR 各自通過 gates，上游改動需重評下游，由人依序驗收。</desc>
      <defs>
        <style>
          .nm { font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
          .sb { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; }
          .lb { font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 12px; font-weight: 500; fill: #4f5d75; }
          .ey { font-family: 'Geist Mono', monospace; font-size: 8px; font-weight: 500; letter-spacing: 0.18em; fill: #4f5d75; }
          .al { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.06em; fill: #7a8399; }
          .co { font-family: 'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif; font-size: 14px; font-style: italic; fill: #2d3142; }
        </style>
        <marker id="s-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="s-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Target zone (not available yet) -->
      <rect x="496" y="20" width="424" height="388" rx="8" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>

      <!-- Panel headings -->
      <text x="40" y="40" class="ey">CURRENT RULE</text>
      <text x="40" y="64" class="nm">現行：相依 feature 依序開工</text>
      <text x="512" y="40" class="ey">TARGET · NOT DECIDED</text>
      <text x="512" y="64" class="nm">目標：stacked PR（尚不可用）</text>

      <!-- Left arrows -->
      <path d="M160 144 V216" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#s-arrow-accent)"/>
      <path d="M160 264 V336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#s-arrow)"/>
      <rect x="168" y="172" width="112" height="16" rx="2" fill="#f5f5f5"/>
      <text x="172" y="184" class="lb" fill="#eb6c36">人工接受＋merge</text>
      <rect x="168" y="292" width="76" height="16" rx="2" fill="#f5f5f5"/>
      <text x="172" y="304" class="lb">才開始實作</text>

      <!-- Right arrows (base relation) -->
      <path d="M620 136 V168" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#s-arrow)"/>
      <path d="M620 216 V248" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#s-arrow)"/>
      <path d="M620 296 V328" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#s-arrow)"/>
      <rect x="628" y="144" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="642" y="153" class="al" text-anchor="middle">BASE</text>
      <rect x="628" y="224" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="642" y="233" class="al" text-anchor="middle">BASE</text>
      <rect x="628" y="304" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="642" y="313" class="al" text-anchor="middle">BASE</text>

      <!-- Left nodes -->
      <rect x="88" y="96" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="88" y="96" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="116" class="nm" text-anchor="middle">PR A（上游）</text>
      <text x="160" y="132" class="sb" text-anchor="middle">base: main</text>

      <rect x="88" y="216" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="88" y="216" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="160" y="236" class="nm" text-anchor="middle">main</text>
      <text x="160" y="252" class="sb" text-anchor="middle">includes A</text>

      <rect x="88" y="336" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="88" y="336" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="160" y="356" class="nm" text-anchor="middle">PR B（下游）</text>
      <text x="160" y="372" class="sb" text-anchor="middle">base: main</text>

      <!-- Right nodes (optional / not yet available) -->
      <rect x="548" y="88" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="548" y="88" width="144" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="620" y="108" class="nm" text-anchor="middle">PR C</text>
      <text x="620" y="124" class="sb" text-anchor="middle">own spec · gates</text>

      <rect x="548" y="168" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="548" y="168" width="144" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="620" y="188" class="nm" text-anchor="middle">PR B</text>
      <text x="620" y="204" class="sb" text-anchor="middle">own spec · gates</text>

      <rect x="548" y="248" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="548" y="248" width="144" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="620" y="268" class="nm" text-anchor="middle">PR A</text>
      <text x="620" y="284" class="sb" text-anchor="middle">own spec · gates</text>

      <rect x="548" y="328" width="144" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="548" y="328" width="144" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="620" y="348" class="nm" text-anchor="middle">main</text>
      <text x="620" y="364" class="sb" text-anchor="middle">merged in order</text>

      <!-- Callouts -->
      <path d="M252 356 Q244 358 236 360" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="236" cy="360" r="2" fill="#2d3142"/>
      <text x="256" y="356" class="co">等待期間可先準備</text>
      <text x="256" y="376" class="co">spec 與 design</text>

      <path d="M712 196 Q704 194 696 192" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="696" cy="192" r="2" fill="#2d3142"/>
      <text x="716" y="180" class="co">每個 PR 各自走三 gates</text>
      <text x="716" y="200" class="co">上游改動要重評下游</text>
      <text x="716" y="220" class="co">B 對 A 通過≠可 merge main</text>
      <text x="716" y="240" class="co">人依序驗收與 merge</text>

      <!-- Legend -->
      <line x1="40" y1="424" x2="920" y2="424" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="440" class="ey">LEGEND</text>
      <rect x="40" y="452" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="64" y="463" class="lb">現行可執行的 PR</text>
      <rect x="200" y="452" width="16" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="224" y="463" class="lb">main</text>
      <rect x="296" y="452" width="16" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="320" y="463" class="lb">目標情境，尚不可用</text>
      <line x1="472" y1="458" x2="500" y2="458" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#s-arrow-accent)"/>
      <text x="508" y="463" class="lb">開工條件</text>
      <line x1="620" y1="458" x2="648" y2="458" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#s-arrow)"/>
      <text x="656" y="463" class="lb">以未合併的上游為 base</text>
    </svg>
    </div>
    <p class="note">還要決定：每個 PR 的依賴與 review base、上游變動後哪些證據失效，以及人工驗收與合併順序。決定並實作之前，照左邊的規則執行。</p>
  </div>
</body>
</html>
